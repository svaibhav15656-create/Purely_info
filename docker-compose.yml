services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investor_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-investor_portal}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [data]
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-investor_portal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-portal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-portal-local-only}
      SERVER_PORT: 8080
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    networks: [portal, data]
volumes:
  postgres_data:
networks:
  portal:
    driver: bridge
  data:
    internal: true
